{% assign pullquote_class = include.class | default: "pullquote--wide" %}
<aside class="pullquote {{ pullquote_class }}">
  {% if include.label %}
  <div class="pullquote__label">{{ include.label }}</div>
  {% endif %}
  <div class="pullquote__text">
    {{ include.text | markdownify }}
  </div>
</aside>
