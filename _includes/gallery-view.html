<div class="gallery-grid">
    {% for card in cards %}
      <a class="gallery-item" href="{{ card.url | relative_url }}">
        <img src="{{ card.url | relative_url }}{{ card.thumbnail }}" alt="{{ card.title }}">
        <div class="gallery-popup">
          <span class="gallery-title">{{ card.title }}</span>
          <p>{{ card.summary }}</p>
        </div>
      </a>
    {% endfor %}
  </div>
