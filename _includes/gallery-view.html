<div class="gallery-grid">
    {% for card in cards %}
      <div class="gallery-item">
        <img src="{{ card.thumbnail | relative_url }}" alt="{{ card.title }}">
        <div class="gallery-popup">
          <a href="{{ card.url | relative_url }}">{{ card.title }}</a>
          <p>{{ card.summary }}</p>
        </div>
      </div>
    {% endfor %}
  </div>
  
  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
      padding: 16px;
    }
  
    .gallery-item {
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
  
    .gallery-item img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
  
    .gallery-popup {
      display: none;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px;
      font-size: 0.85rem;
    }
  
    .gallery-popup a {
      color: #f0c040;
      font-weight: bold;
      text-decoration: none;
      display: block;
      margin-bottom: 4px;
    }
  
    .gallery-popup a:hover {
      text-decoration: underline;
    }
  
    .gallery-popup p {
      margin: 0;
    }
  
    .gallery-item:hover .gallery-popup {
      display: block;
    }
  </style>
